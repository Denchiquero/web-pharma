<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Герой: предпросмотр</title>
<script src="./vendor/aframe.min.js"></script></head>
<body>
<a-scene embedded style="height:100vh" vr-mode-ui="enabled: false">
  <a-sky color="#fff6e5"></a-sky>
  <a-light type="ambient" intensity="0.9"></a-light>
  <a-light type="directional" position="1 2 2" intensity="0.6"></a-light>
  <a-entity id="stage" position="0 -0.3 -2.5"></a-entity>
</a-scene>
<button id="t" style="position:fixed;bottom:16px;left:16px;padding:12px;z-index:9">Обрадовать героя</button>
<script type="module">
  import { HERO_HTML } from './hero.js';
  document.getElementById('stage').insertAdjacentHTML('beforeend', HERO_HTML);
  document.getElementById('t').onclick = () => document.getElementById('hero').emit('happy');
</script>
</body></html>
