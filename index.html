<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1, user-scalable=no"
  >

  <title>Солнышко: оживи упаковку</title>

  <script src="./vendor/aframe.min.js"></script>
  <script src="./vendor/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;

      padding: 16px;
      box-sizing: border-box;
    }

    #hud > * {
      pointer-events: auto;
    }

    .bubble {
      background: #fffd;
      border-radius: 16px;
      padding: 10px 16px;
      font-size: 18px;
      text-align: center;
      max-width: 90%;
    }

    #stars {
      font-size: 36px;
      min-height: 44px;
    }

    #give {
      font-size: 22px;
      padding: 16px 28px;
      border: 0;
      border-radius: 32px;
      background: #ff9f43;
      color: #fff;
    }

    #give:disabled {
      background: #b2bec3;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

<div id="hud">
  <div>
    <div class="bubble" id="hint">
      Наведи камеру на мордочку героя на упаковке
    </div>

    <div id="stars"></div>
  </div>

  <div style="text-align:center">

    <div class="bubble" id="done" hidden>
      Молодец! На сегодня всё. Завтра герой ждёт снова.
    </div>

    <button id="give" hidden>
      Дай лекарство
    </button>

    <div
            class="bubble"
            style="margin-top:8px;font-size:14px"
    >
      Лекарство даёт взрослый. Это учебная игра.
    </div>

  </div>
</div>


<a-scene
        mindar-image="
    imageTargetSrc: ./targets.mind;
    uiScanning: no;
    uiLoading: no
  "
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
>

  <!-- ВОТ СЮДА ДОБАВЛЯЕМ МОДЕЛИ -->
  <a-assets>

    <a-asset-item
            id="hero-model"
            src="./bear.glb">
    </a-asset-item>

  </a-assets>


  <a-light
          type="ambient"
          intensity="0.9">
  </a-light>

  <a-light
          type="directional"
          position="1 2 2"
          intensity="0.6">
  </a-light>


  <a-camera
          position="0 0 0"
          look-controls="enabled: false">
  </a-camera>


  <a-entity
          id="target"
          mindar-image-target="targetIndex: 0">
  </a-entity>

</a-scene>


<script
        type="module"
        src="./main.js">
</script>

</body>
</html>
